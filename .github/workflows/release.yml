name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without v prefix, e.g. 0.3.0)'
        required: true
        type: string
      notes:
        description: 'Release notes'
        required: false
        type: string
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Bump version in cli.zsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i "s|^typeset -g _SAGE_VERSION=\".*\"|typeset -g _SAGE_VERSION=\"${VERSION}\"|" src/core/cli.zsh
          grep _SAGE_VERSION src/core/cli.zsh

      - name: Commit version bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/core/cli.zsh
          if git diff --cached --quiet; then
            echo "Version already up to date, skipping commit"
          else
            git commit -m "Bump version to v${VERSION}"
            git push
          fi

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Pass inputs via env, never inline in the script: notes containing
          # backticks, quotes or $ would otherwise be executed by bash.
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -z "$NOTES" ]; then
            NOTES="Release v${VERSION}"
          fi
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "$NOTES" \
            --target main
